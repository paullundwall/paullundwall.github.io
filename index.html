<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuklops: A Wargaming Experiment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink: #16161a;
            --muted: #8a8a93;
            --line: #e7e7ea;
            --hover: #f6f6f7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #ffffff;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        header {
            text-align: center;
            margin-bottom: 64px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.35em;
            font-size: clamp(2.75rem, 9vw, 4.25rem);
        }

        .eye {
            width: 1.05em;
            height: 1.05em;
            flex-shrink: 0;
            animation: blink 7s infinite;
            transform-origin: center;
        }

        @keyframes blink {
            0%, 94%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.08); }
        }

        h1 {
            font-size: 1em;
            font-weight: 700;
            letter-spacing: -0.035em;
            line-height: 1;
        }

        .subtitle {
            margin-top: 16px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .games {
            list-style: none;
            border-top: 1px solid var(--line);
        }

        .game {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--line);
            transition: background 0.2s ease;
        }

        .game:hover {
            background: var(--hover);
        }

        .game-link {
            flex: 1;
            display: flex;
            align-items: baseline;
            gap: 16px;
            padding: 22px 12px;
            color: inherit;
            text-decoration: none;
        }

        .game-index {
            font-size: 0.75rem;
            font-variant-numeric: tabular-nums;
            color: var(--muted);
            letter-spacing: 0.05em;
        }

        .game-name {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.015em;
        }

        .game-arrow {
            margin-left: auto;
            color: var(--muted);
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .game:hover .game-arrow {
            transform: translateX(4px);
            color: var(--ink);
        }

        .info-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            margin-right: 12px;
            border: 1px solid var(--line);
            border-radius: 50%;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 600;
            font-style: italic;
            font-family: Georgia, serif;
            text-decoration: none;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .game:not(:has(.info-link))::after {
            content: "";
            width: 40px;
            flex-shrink: 0;
        }

        .info-link:hover {
            color: var(--ink);
            border-color: var(--ink);
        }

        .series {
            border-bottom: 1px solid var(--line);
        }

        .series summary {
            list-style: none;
            cursor: pointer;
            padding-right: 52px;
            transition: background 0.2s ease;
        }

        .series summary::-webkit-details-marker {
            display: none;
        }

        .series summary:hover {
            background: var(--hover);
        }

        .chevron {
            margin-left: auto;
            align-self: center;
            width: 8px;
            height: 8px;
            border-right: 1.5px solid var(--muted);
            border-bottom: 1.5px solid var(--muted);
            transform: translateY(-2px) rotate(45deg);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .series summary:hover .chevron {
            border-color: var(--ink);
        }

        .series details[open] .chevron {
            transform: translateY(2px) rotate(-135deg);
        }

        .battles {
            list-style: none;
            padding-bottom: 10px;
        }

        .battle-link {
            display: flex;
            align-items: baseline;
            gap: 14px;
            padding: 12px 52px 12px 46px;
            color: inherit;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .battle-link:hover {
            background: var(--hover);
        }

        .battle-name {
            font-size: 1.05rem;
            font-weight: 500;
        }

        .battle-date {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .battle-link:hover .game-arrow {
            transform: translateX(4px);
            color: var(--ink);
        }

        a:focus-visible, summary:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            .eye { animation: none; }
        }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <div class="brand">
                <svg class="eye" viewBox="0 0 48 48" fill="none" aria-hidden="true">
                    <path d="M3 24C9 13.5 16 8.5 24 8.5S39 13.5 45 24C39 34.5 32 39.5 24 39.5S9 34.5 3 24Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
                    <circle cx="24" cy="24" r="8.5" fill="currentColor"/>
                    <circle cx="27" cy="21" r="2.4" fill="#ffffff"/>
                </svg>
                <h1>Kuklops</h1>
            </div>
            <p class="subtitle">A Wargaming Experiment</p>
        </header>

        <ul class="games">
            <li class="series">
                <details>
                    <summary class="game-link">
                        <span class="game-index">01</span>
                        <span class="game-name">Napoleonic Wars</span>
                        <span class="chevron" aria-hidden="true"></span>
                    </summary>
                    <ul class="battles">
                        <li class="battle">
                            <a href="Austerlitz/?v=10" class="battle-link">
                                <span class="battle-name">Austerlitz</span>
                                <span class="battle-date">2 December 1805</span>
                                <span class="game-arrow" aria-hidden="true">&rarr;</span>
                            </a>
                        </li>
                        <li class="battle">
                            <a href="Jena/?v=10" class="battle-link">
                                <span class="battle-name">Jena</span>
                                <span class="battle-date">14 October 1806</span>
                                <span class="game-arrow" aria-hidden="true">&rarr;</span>
                            </a>
                        </li>
                    </ul>
                </details>
            </li>
            <li class="game">
                <a href="Cursus Honorum/index.html" class="game-link">
                    <span class="game-index">02</span>
                    <span class="game-name">Cursus Honorum</span>
                    <span class="game-arrow" aria-hidden="true">&rarr;</span>
                </a>
            </li>
            <li class="game">
                <a href="Petroleum/index.html" class="game-link">
                    <span class="game-index">03</span>
                    <span class="game-name">Petroleum</span>
                    <span class="game-arrow" aria-hidden="true">&rarr;</span>
                </a>
                <a href="Petroleum/info.html" class="info-link" aria-label="Petroleum info">i</a>
            </li>
        </ul>
    </main>
</body>
</html>
